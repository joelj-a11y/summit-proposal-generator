    <script type="text/babel">

const { useState, useEffect } = React;


function StormwaterQuoteGenerator() {
  // Inspector data with coordinates (excluding office staff)
  const inspectors = [
    { name: "Allison Blyton", address: "392 Audrey Dr, Loveland, CO 80537", lat: 40.3978, lon: -105.0750 },
    { name: "Anthony Cipperly", address: "PO Box 253221 W 5th St., Palisade, CO 81526", lat: 39.1103, lon: -108.3517 },
    { name: "Britlyn R Romero", address: "530 N Cherry St, Fruita, CO 81521", lat: 39.1592, lon: -108.7289 },
    { name: "Brooks M Bosco", address: "1860 Golden Ranch Rd, Fruita, CO 81521", lat: 39.1592, lon: -108.7289 },
    { name: "Camden J. Sherrill", address: "2763 Compass Dr Apt 205, Grand Junction, CO 81506", lat: 39.0639, lon: -108.5506 },
    { name: "Daniel C Kintz", address: "436 Montero Street, Grand Junction, CO 81507", lat: 39.0639, lon: -108.5506 },
    { name: "Daniel Peterson", address: "3501 Stanford Rd Apt 113, Fort Collins, CO 80525", lat: 40.5853, lon: -105.0844 },
    { name: "Dustin M Graf", address: "820 Mease Rd, Grand Junction, CO 81505", lat: 39.0639, lon: -108.5506 },
    { name: "Haley Hinger", address: "850 Sir Galahad Dr Apt B, Lafayette, CO 80026", lat: 39.9936, lon: -105.0897 },
    { name: "Jesse R Tietz", address: "532 Kirby Dr, Grand Junction, CO 81504", lat: 39.0639, lon: -108.5506 },
    { name: "Katherine Bergen", address: "909 Venice St Apt B, Longmont, CO 80501", lat: 40.1672, lon: -105.1019 },
    { name: "Matthew T Fought", address: "220 Alcove Dr, Grand Junction, CO 81507", lat: 39.0639, lon: -108.5506 },
    { name: "Max Hall", address: "2775 Oro Blanco Dr, Colorado Springs, CO 80917", lat: 38.8339, lon: -104.8214 },
    { name: "Natasha N Jennings", address: "424 Pisces Circle, Fruita, CO 81521", lat: 39.1592, lon: -108.7289 },
    { name: "Rebekah Adams", address: "200 Rood Ave Apt 2224, Grand Junction, CO 81501", lat: 39.0639, lon: -108.5506 },
    { name: "Robert Kyle West", address: "117 Bristlecone Circle, Bailey, CO 80421", lat: 39.4081, lon: -105.4769 },
    { name: "Roxanne L Fromang", address: "3864 County Road 2, Rangely, CO 81648", lat: 40.0875, lon: -108.8048 },
    { name: "Skyler E. Pixley", address: "1507 Bradley Dr, Boulder, CO 80305", lat: 40.0150, lon: -105.2705 },
    { name: "Stefan P Majewski", address: "2601 W Front View CresApt 206, Denver, CO 80202", lat: 39.7539, lon: -105.0047 },
    { name: "Travis Williams", address: "1103 Claremont Drive, Fruita, CO 81521", lat: 39.1592, lon: -108.7289 }
  ];

  // Rate sheet pricing tiers for comparison
  const rateSheetTiers = [
    { min: 0, max: 1, price: 105, label: "Less than 1 acre" },
    { min: 1, max: 2, price: 125, label: "1-2 acres" },
    { min: 2, max: 4, price: 140, label: "2-4 acres" },
    { min: 4, max: 5, price: 140, label: "4-5 acres" },
    { min: 5, max: 10, price: 170, label: "5-10 acres" },
    { min: 10, max: 25, price: 200, label: "10-25 acres" },
    { min: 25, max: 50, price: 230, label: "25-50 acres" },
    { min: 50, max: 75, price: 260, label: "50-75 acres" }
  ];

  const [formData, setFormData] = useState({
    siteContactName: '',
    siteContactEmail: '',
    siteContactPhone: '',
    summitContact: '',
    summitEmail: '',
    summitPhone: '',
    clientName: '',
    projectName: '',
    projectCity: '',
    projectCounty: '',
    projectAddress: '',
    projectCoords: '',
    projectLat: '',
    projectLon: '',
    disturbedAcres: '',
    projectType: 'Residential',
    constructionMonths: '',
    postConstructionMonths: '',
    weeklyInspections: false,
    includePermitting: false,
    permittingPrice: '',
    permittingDescription: '',
    include1A: false,
    price1A: '',
    description1A: '',
    include1B: false,
    price1B: '',
    description1B: '',
    include5: false,
    price5: '',
    tableDescription5: '',
    scopeDescription5: '',
    include6: false,
    price6: '',
    tableDescription6: '',
    scopeDescription6: '',
    hourlyRate: '100',
    postConstructionPercent: '85',
    manualRoutineRate: '',
    manualPostConstructionRate: '',
    flatRateBiWeeklyMultiplier: '2.5',
    flatRateWeeklyMultiplier: '5.0'
  });

  const [calculating, setCalculating] = useState(false);
  const [quote, setQuote] = useState(null);
  const [error, setError] = useState('');
  const [geocoding, setGeocoding] = useState(false);

  // Recalculate project totals when rates are manually changed
  React.useEffect(() => {
    if (!quote) return;
    
    // Use final rates (manual override or calculated)
    const routineRate = quote.calculated.finalRoutineRate || quote.calculated.total;
    const postConstructionRate = quote.calculated.finalPostConstructionRate || quote.calculated.postConstruction;
    
    const inspectionsPerMonth = formData.weeklyInspections ? 4 : 2;
    const constructionMonths = parseFloat(formData.constructionMonths) || 0;
    const postConstructionMonths = parseFloat(formData.postConstructionMonths) || 0;
    
    const totalRoutineInspections = inspectionsPerMonth * constructionMonths;
    const totalPostConstructionInspections = postConstructionMonths;
    const totalPostStormInspections = Math.ceil(0.6 * constructionMonths);
    
    const routineInspectionsTotal = totalRoutineInspections * routineRate;
    const postConstructionInspectionsTotal = totalPostConstructionInspections * postConstructionRate;
    const postStormInspectionsTotal = totalPostStormInspections * routineRate;
    const inspectionsSubtotal = routineInspectionsTotal + postConstructionInspectionsTotal + postStormInspectionsTotal;
    
    const permittingTotal = formData.includePermitting ? (parseFloat(formData.permittingPrice) || 0) : 0;
    const total1A = formData.include1A ? (parseFloat(formData.price1A) || 0) : 0;
    const total1B = formData.include1B ? (parseFloat(formData.price1B) || 0) : 0;
    const total5 = formData.include5 ? (parseFloat(formData.price5) || 0) : 0;
    const total6 = formData.include6 ? (parseFloat(formData.price6) || 0) : 0;
    const projectTotal = inspectionsSubtotal + permittingTotal + total1A + total1B + total5 + total6;
    
    setQuote(prev => ({
      ...prev,
      projectTotals: {
        ...prev.projectTotals,
        routineInspectionsTotal,
        postConstructionInspectionsTotal,
        postStormInspectionsTotal,
        inspectionsSubtotal,
        projectTotal
      }
    }));
  }, [quote?.calculated.finalRoutineRate, quote?.calculated.finalPostConstructionRate, formData.manualRoutineRate, formData.manualPostConstructionRate, formData.weeklyInspections, formData.constructionMonths, formData.postConstructionMonths, formData.includePermitting, formData.permittingPrice, formData.include1A, formData.price1A, formData.include1B, formData.price1B, formData.include5, formData.price5, formData.include6, formData.price6]);

  const duplicateForNewGC = () => {
    // Keep all project data, clear only client/contact info
    setFormData(prev => ({
      ...prev,
      siteContactName: '',
      siteContactEmail: '',
      siteContactPhone: '',
      clientName: ''
    }));
    
    // Clear the current quote to show the form
    setQuote(null);
    
    // Scroll to top of form
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const projectTypes = [
    'Residential',
    'Commercial',
    'Multi-Family',
    'Transmission Line',
    'Pipeline',
    'Highway'
  ];

  const handleInputChange = (e) => {
    const { name, value } = e.target;
    setFormData(prev => ({
      ...prev,
      [name]: value
    }));
  };

  const handleCheckboxChange = (e) => {
    const { name, checked } = e.target;
    setFormData(prev => ({
      ...prev,
      [name]: checked
    }));
  };

  // Parse coordinates from Google Maps format (e.g., "39.7392, -104.9903")
  const handleCoordsChange = async (e) => {
    const coords = e.target.value;
    setFormData(prev => ({ ...prev, projectCoords: coords }));

    // Try to parse lat/long
    const match = coords.match(/([-+]?\d+\.?\d*)\s*,\s*([-+]?\d+\.?\d*)/);
    if (match) {
      const lat = parseFloat(match[1]);
      const lon = parseFloat(match[2]);
      
      // Validate coordinates are reasonable for US
      if (lat >= 24 && lat <= 50 && lon >= -125 && lon <= -65) {
        setFormData(prev => ({
          ...prev,
          projectLat: lat,
          projectLon: lon
        }));
        
        // Clear any previous error
        setError('');
      } else {
        setError('⚠️ Coordinates appear to be outside the US.');
      }
    }
  };

  // Haversine formula for straight-line distance
  const calculateDistance = (lat1, lon1, lat2, lon2) => {
    const R = 3959; // Earth's radius in miles
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
      Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  };

  const findNearestInspector = (projectLat, projectLon) => {
    let minDistance = Infinity;
    let nearestInspector = null;

    inspectors.forEach(inspector => {
      const distance = calculateDistance(
        inspector.lat, 
        inspector.lon, 
        parseFloat(projectLat), 
        parseFloat(projectLon)
      );
      if (distance < minDistance) {
        minDistance = distance;
        nearestInspector = inspector;
      }
    });

    return {
      inspector: nearestInspector,
      oneWayDistance: minDistance,
      roundTripDistance: minDistance * 2
    };
  };

  const getInspectionTimeForAcres = (acres, projectType) => {
    const acreNum = parseFloat(acres);
    let baseTime;
    
    if (acreNum < 5) baseTime = 0.5;
    else if (acreNum < 10) baseTime = 0.65;
    else if (acreNum < 25) baseTime = 1.0;
    else if (acreNum < 50) baseTime = 1.5;
    else if (acreNum < 75) baseTime = 2.0;
    else return null; // Manual entry needed for 75+
    
    // Add 20% for linear projects (Transmission Line, Pipeline, Highway)
    const linearProjects = ['Transmission Line', 'Pipeline', 'Highway'];
    if (linearProjects.includes(projectType)) {
      baseTime = baseTime * 1.2;
    }
    
    return baseTime;
  };

  const getRateSheetPrice = (acres) => {
    const acreNum = parseFloat(acres);
    
    for (let tier of rateSheetTiers) {
      if (acreNum >= tier.min && acreNum < tier.max) {
        return { price: tier.price, tier: tier.label };
      }
    }
    
    if (acreNum >= 75) {
      return { price: null, tier: "Over 75 acres - Custom Quote" };
    }
    
    return { price: null, tier: "Unknown" };
  };

  const generateQuote = async () => {
    setError('');
    setCalculating(true);

    try {
      // Validate required fields
      const requiredFields = [
        { field: 'summitContact', label: 'Summit Contact Name' },
        { field: 'summitEmail', label: 'Summit Email' },
        { field: 'summitPhone', label: 'Summit Phone' },
        { field: 'clientName', label: 'Client Name' },
        { field: 'projectName', label: 'Project Name' },
        { field: 'projectLat', label: 'Project Coordinates' },
        { field: 'projectLon', label: 'Project Coordinates' },
        { field: 'disturbedAcres', label: 'Disturbed Acres' },
        { field: 'constructionMonths', label: 'Active Construction Duration' }
      ];

      const missingFields = [];
      for (const { field, label } of requiredFields) {
        if (!formData[field] || formData[field] === '') {
          missingFields.push(label);
        }
      }

      if (missingFields.length > 0) {
        throw new Error(`Please fill in required fields:\n• ${missingFields.join('\n• ')}`);
      }

      if (!formData.projectLat || !formData.projectLon || !formData.disturbedAcres) {
        throw new Error('Please fill in project coordinates and disturbed acres');
      }

      const inspectionTimeHours = getInspectionTimeForAcres(formData.disturbedAcres, formData.projectType);
      
      if (inspectionTimeHours === null) {
        throw new Error('For projects over 75 acres, please contact us for a custom quote');
      }

      // Find nearest inspector
      const { inspector, oneWayDistance, roundTripDistance } = findNearestInspector(
        formData.projectLat,
        formData.projectLon
      );

      // Calculate drive time (assuming 45 mph average)
      const avgSpeed = 45; // mph
      
      // Use one-way for <50 miles, round-trip for 50+ miles
      const distanceForCalculation = oneWayDistance < 50 ? oneWayDistance : roundTripDistance;
      const driveTimeHours = distanceForCalculation / avgSpeed;

      // CALCULATED PRICING - use editable hourly rate
      const hourlyRate = parseFloat(formData.hourlyRate) || 100;
      const adminCost = 50;
      const driveCost = driveTimeHours * hourlyRate;
      const inspectionCost = inspectionTimeHours * hourlyRate;
      const calculatedSubtotal = adminCost + driveCost + inspectionCost;
      
      // Round up to nearest $5
      const calculatedTotal = Math.ceil(calculatedSubtotal / 5) * 5;
      
      // Determine final rates - use manual if provided, otherwise use calculated
      let finalRoutineRate;
      let finalPostConstructionRate;
      
      if (formData.manualRoutineRate && parseFloat(formData.manualRoutineRate) > 0) {
        // Use manual override
        finalRoutineRate = parseFloat(formData.manualRoutineRate);
        finalPostConstructionRate = parseFloat(formData.manualPostConstructionRate) || Math.ceil((finalRoutineRate * 0.85) / 5) * 5;
      } else {
        // Use calculated rates
        finalRoutineRate = calculatedTotal;
        const postConstructionPercent = parseFloat(formData.postConstructionPercent) || 85;
        finalPostConstructionRate = Math.ceil((calculatedTotal * (postConstructionPercent / 100)) / 5) * 5;
      }

      // Calculate project totals using final rates
      const inspectionsPerMonth = formData.weeklyInspections ? 4 : 2;
      const constructionMonths = parseFloat(formData.constructionMonths) || 0;
      const postConstructionMonths = parseFloat(formData.postConstructionMonths) || 0;
      
      const totalRoutineInspections = inspectionsPerMonth * constructionMonths;
      const totalPostConstructionInspections = postConstructionMonths; // 1 per month
      
      // Post-storm event inspections: 0.6 per month during construction, rounded up
      const postStormRate = finalRoutineRate; // Same as routine rate
      const totalPostStormInspections = Math.ceil(0.6 * constructionMonths);
      
      const routineInspectionsTotal = totalRoutineInspections * finalRoutineRate;
      const postConstructionInspectionsTotal = totalPostConstructionInspections * finalPostConstructionRate;
      const postStormInspectionsTotal = totalPostStormInspections * postStormRate;
      const inspectionsSubtotal = routineInspectionsTotal + postConstructionInspectionsTotal + postStormInspectionsTotal;
      
      // Stormwater Permitting Assistance - custom price if selected
      const permittingTotal = formData.includePermitting ? (parseFloat(formData.permittingPrice) || 0) : 0;
      const total1A = formData.include1A ? (parseFloat(formData.price1A) || 0) : 0;
      const total1B = formData.include1B ? (parseFloat(formData.price1B) || 0) : 0;
      const total5 = formData.include5 ? (parseFloat(formData.price5) || 0) : 0;
      const total6 = formData.include6 ? (parseFloat(formData.price6) || 0) : 0;
      
      // Project total includes inspections + optional services
      const projectTotal = inspectionsSubtotal + permittingTotal + total1A + total1B + total5 + total6;

      // RATE SHEET COMPARISON
      const rateSheetData = getRateSheetPrice(formData.disturbedAcres);

      // Calculate difference
      const difference = rateSheetData.price ? calculatedTotal - rateSheetData.price : null;
      const percentDiff = rateSheetData.price ? ((difference / rateSheetData.price) * 100) : null;

      setQuote({
        calculated: {
          admin: adminCost,
          driveTimeHours: driveTimeHours,
          driveCost: driveCost,
          inspectionTimeHours: inspectionTimeHours,
          inspectionCost: inspectionCost,
          subtotal: calculatedSubtotal,
          total: calculatedTotal,
          postConstruction: Math.ceil((calculatedTotal * 0.85) / 5) * 5,
          finalRoutineRate: finalRoutineRate,
          finalPostConstructionRate: finalPostConstructionRate
        },
        projectTotals: {
          inspectionsPerMonth: inspectionsPerMonth,
          constructionMonths: constructionMonths,
          postConstructionMonths: postConstructionMonths,
          totalRoutineInspections: totalRoutineInspections,
          totalPostConstructionInspections: totalPostConstructionInspections,
          totalPostStormInspections: totalPostStormInspections,
          routineInspectionsTotal: routineInspectionsTotal,
          postConstructionInspectionsTotal: postConstructionInspectionsTotal,
          postStormInspectionsTotal: postStormInspectionsTotal,
          inspectionsSubtotal: inspectionsSubtotal,
          permittingTotal: permittingTotal,
          projectTotal: projectTotal
        },
        rateSheet: {
          price: rateSheetData.price,
          tier: rateSheetData.tier,
          postConstruction: rateSheetData.price ? Math.round(rateSheetData.price * 0.85) : null
        },
        comparison: {
          difference: difference,
          percentDiff: percentDiff
        },
        inspector: inspector,
        distance: {
          oneWay: oneWayDistance,
          roundTrip: roundTripDistance,
          usedForCalculation: distanceForCalculation,
          calculationMethod: oneWayDistance < 50 ? 'one-way' : 'round-trip'
        },
        projectInfo: formData
      });

    } catch (err) {
      setError(err.message);
    } finally {
      setCalculating(false);
    }
  };

  return (
    <div style={{
      minHeight: '100vh',
      background: 'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)',
      fontFamily: '"Archivo", -apple-system, sans-serif',
      padding: '40px 20px'
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
        
        * {
          box-sizing: border-box;
        }

        .container {
          max-width: 1400px;
          margin: 0 auto;
        }

        .header {
          text-align: center;
          margin-bottom: 60px;
          color: white;
        }

        .header h1 {
          font-size: 48px;
          font-weight: 700;
          margin: 0 0 16px 0;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .header p {
          font-size: 18px;
          color: rgba(255, 255, 255, 0.7);
          font-family: 'Space Mono', monospace;
        }

        .card {
          background: rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 24px;
          padding: 40px;
          margin-bottom: 24px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
          font-size: 24px;
          font-weight: 600;
          color: white;
          margin: 0 0 24px 0;
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .form-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 20px;
          margin-bottom: 24px;
        }

        .form-group {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .form-group label {
          font-size: 14px;
          font-weight: 500;
          color: rgba(255, 255, 255, 0.9);
          font-family: 'Space Mono', monospace;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select {
          padding: 14px 16px;
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.15);

          transition: all 0.3s ease;

          background: #1a2332;

        }

        }

        .info-box strong {
          color: #00d4ff;
          display: block;
          margin-bottom: 8px;
        }

        .info-box a {
          color: #00d4ff;
          text-decoration: none;
        }

        .button {
          padding: 16px 32px;
          background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
          border: none;
          border-radius: 12px;
          color: white;
          font-size: 16px;
          font-weight: 600;
          font-family: 'Archivo', sans-serif;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          transition: all 0.3s ease;
          box-shadow: 0 8px 24px rgba(123, 47, 247, 0.3);
        }

        .button:hover {
          transform: translateY(-2px);
          box-shadow: 0 12px 32px rgba(123, 47, 247, 0.4);
        }

        .button:disabled {
          opacity: 0.5;
          cursor: not-allowed;
          transform: none;
        }

        .quote-results {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 24px;
          margin-bottom: 24px;
        }

        @media (max-width: 1024px) {
          .quote-results {
            grid-template-columns: 1fr;
          }
        }

        .breakdown-card {
          background: rgba(0, 212, 255, 0.05);
          border: 1px solid rgba(0, 212, 255, 0.2);
          border-radius: 16px;
          padding: 24px;
        }

        .breakdown-card h3 {
          font-size: 18px;
          font-weight: 600;
          color: #00d4ff;
          margin: 0 0 20px 0;
          font-family: 'Space Mono', monospace;
        }

        .breakdown-item {
          display: flex;
          justify-content: space-between;
          padding: 12px 0;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
          color: rgba(255, 255, 255, 0.8);
          font-size: 14px;
        }

        .breakdown-item:last-child {
          border-bottom: none;
          padding-top: 16px;
          margin-top: 8px;
          font-size: 18px;
          font-weight: 700;
          color: white;
        }

        .breakdown-item .label {
          font-family: 'Space Mono', monospace;
        }

        .breakdown-item .value {
          font-weight: 600;
        }

        .comparison-card {
          background: rgba(255, 193, 7, 0.05);
          border: 1px solid rgba(255, 193, 7, 0.3);
          border-radius: 16px;
          padding: 24px;
        }

        .comparison-card h3 {
          font-size: 18px;
          font-weight: 600;
          color: #ffc107;
          margin: 0 0 20px 0;
          font-family: 'Space Mono', monospace;
        }

        .comparison-highlight {
          background: rgba(255, 193, 7, 0.1);
          border-radius: 12px;
          padding: 16px;
          margin: 12px 0;
          text-align: center;
        }

        .comparison-highlight .diff-label {
          font-size: 12px;

                  </div>
                </div>

                <div className="comparison-card">
                  <h3>📊 Rate Sheet Comparison</h3>
                  <div className="breakdown-item">
                    <span className="label">Rate Sheet Tier</span>
                    <span className="value">{quote.rateSheet.tier}</span>
                  </div>
                  <div className="breakdown-item">
                    <span className="label">Rate Sheet Price</span>
                    <span className="value">${quote.rateSheet.price}</span>
                  </div>
                  
                  {quote.comparison.difference !== null && (
                    <div className={`comparison-highlight ${quote.comparison.difference > 0 ? 'positive' : 'negative'}`}>
                      <div className="diff-label">Difference</div>
                      <div className="diff-value">
                        {quote.comparison.difference > 0 ? '+' : ''}${quote.comparison.difference.toFixed(2)}
                      </div>
                      <div className="diff-percent">
                        ({quote.comparison.percentDiff > 0 ? '+' : ''}{quote.comparison.percentDiff.toFixed(1)}%)
                      </div>
                    </div>
                  )}
                  
                  <div style={{marginTop: '16px', padding: '12px', background: 'rgba(255,255,255,0.05)', borderRadius: '8px', fontSize: '12px', color: 'rgba(255,255,255,0.7)'}}>
                    {quote.comparison.difference !== null && Math.abs(quote.comparison.percentDiff) < 10 ? (
                      '✅ Close match! Calculated price aligns well with rate sheet.'
                    ) : quote.comparison.difference > 0 ? (
                      '⚠️ Calculated price is higher than rate sheet. Consider using rate sheet price or adjusting quote.'
                    ) : (
                      '⚠️ Calculated price is lower than rate sheet. You may be underpricing this project.'
                    )}
                  </div>
                </div>

                <div className="client-card">
                  <h3>💼 Recommended Quote</h3>
                  
                  {/* Manual Rate Override Section */}
                  <div style={{marginBottom: '24px', padding: '16px', background: 'rgba(241, 196, 15, 0.1)', borderRadius: '8px', border: '2px solid rgba(241, 196, 15, 0.3)'}}>
                    <h4 style={{fontSize: '14px', fontWeight: '600', marginBottom: '12px', color: '#ffffff'}}>
                      💰 Override Inspection Rates (Optional)
                    </h4>
                    <div style={{fontSize: '12px', color: 'rgba(255,255,255,0.7)', marginBottom: '12px'}}>
                      Leave blank to use calculated rates. Post-construction auto-updates to 85% of routine rate.
                    </div>
                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px'}}>
                      <div>
                        <label style={{fontSize: '13px', fontWeight: '500', display: 'block', marginBottom: '4px', color: '#ffffff'}}>
                          Manual Routine Rate
                        </label>
                        <input
                          type="number"
                          name="manualRoutineRate"
                          value={formData.manualRoutineRate}
                          onChange={(e) => {
                            handleInputChange(e);
                            // Auto-update post-construction rate
                            const newRoutineRate = parseFloat(e.target.value) || 0;
                            if (newRoutineRate > 0) {
                              const newPostConstRate = Math.ceil((newRoutineRate * 0.85) / 5) * 5;
                              setFormData(prev => ({
                                ...prev,
                                manualPostConstructionRate: newPostConstRate.toString()
                              }));
                            } else {
                              setFormData(prev => ({
                                ...prev,
                                manualPostConstructionRate: ''
                              }));
                            }
                          }}
                          placeholder={`Calculated: $${quote.calculated.total}`}
                          style={{
                            width: '100%',
                            padding: '8px',
                            fontSize: '14px',
                            borderRadius: '4px',
                            border: '1px solid rgba(255,255,255,0.3)',
                            background: 'rgba(255, 255, 255, 0.1)',
                            color: 'white'
                          }}
                        />
                      </div>
                      <div>
                        <label style={{fontSize: '13px', fontWeight: '500', display: 'block', marginBottom: '4px', color: '#ffffff'}}>
                          Post-Construction Rate (Auto)
                        </label>
                        <input
                          type="number"
                          name="manualPostConstructionRate"
                          value={formData.manualPostConstructionRate}
                          readOnly
                          placeholder={`Calculated: $${quote.calculated.postConstruction}`}
                          style={{
                            width: '100%',
                            padding: '8px',
                            fontSize: '14px',
                            borderRadius: '4px',
                            border: '1px solid rgba(255,255,255,0.3)',
                            background: '#2c3e50',
                            color: '#00d4ff',
                            cursor: 'not-allowed'
                          }}
                        />
                        <div style={{fontSize: '11px', color: 'rgba(255,255,255,0.6)', marginTop: '2px'}}>
                          85% of routine, rounded to $5
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Display Active Rates */}
                  <div style={{marginBottom: '24px'}}>
                    <div style={{fontSize: '14px', color: 'rgba(255,255,255,0.6)', marginBottom: '8px'}}>
                      {formData.manualRoutineRate ? 'Manual Override Active' : 'Using Calculated Rates'}
                    </div>
                    <div style={{
                      padding: '12px',
                      fontSize: '32px',
                      fontWeight: '700',
                      textAlign: 'center',
                      background: formData.manualRoutineRate ? 'rgba(241, 196, 15, 0.2)' : 'rgba(255, 255, 255, 0.1)',
                      border: `2px solid ${formData.manualRoutineRate ? 'rgba(241, 196, 15, 0.5)' : 'rgba(255, 255, 255, 0.3)'}`,
                      borderRadius: '8px',
                      color: 'white'
                    }}>
                      ${(quote.calculated.finalRoutineRate || quote.calculated.total).toFixed(0)}
                    </div>
                    <div className="subtitle" style={{marginTop: '8px'}}>Per Inspection (Weekly/Bi-weekly)</div>
                  </div>
                  
                  <div className="post-construction">
                    <div className="post-construction-label">Post-Construction Monthly</div>
                    <div style={{
                      padding: '8px',
                      fontSize: '24px',
                      fontWeight: '700',
                      textAlign: 'center',
                      background: 'rgba(0, 212, 255, 0.1)',
                      border: '2px solid rgba(0, 212, 255, 0.3)',
                      borderRadius: '8px',
                      color: '#00d4ff',
                      marginTop: '8px'
                    }}>
                      ${(quote.calculated.finalPostConstructionRate || quote.calculated.postConstruction).toFixed(0)}
                    </div>
                  </div>
                  
                  <div style={{
                    marginTop: '16px',
                    padding: '12px',
                    background: 'rgba(255, 193, 7, 0.1)',
                    border: '1px solid rgba(255, 193, 7, 0.3)',
                    borderRadius: '8px',
                    fontSize: '12px',
                    color: 'rgba(255,255,255,0.6)',
                    textAlign: 'left'
                  }}>
                    💡 <strong style={{color: '#ffc107'}}>Manual Override:</strong> Click on any rate to edit it for special pricing situations.
                  </div>
                </div>
              </div>
            </div>

            {quote.projectTotals && (quote.projectTotals.constructionMonths > 0 || quote.projectTotals.postConstructionMonths > 0) && (
              <div className="card">
                <h2>💰 Project Totals</h2>
                
                <div style={{
                  background: 'rgba(0, 212, 255, 0.05)',
                  border: '1px solid rgba(0, 212, 255, 0.2)',
                  borderRadius: '16px',
                  padding: '24px',
                  marginBottom: '24px'
                }}>
                  <h3 style={{
                    fontSize: '18px',
                    fontWeight: '600',
                    color: '#00d4ff',
                    margin: '0 0 20px 0',
                    fontFamily: "'Space Mono', monospace"
                  }}>Inspections Breakdown</h3>
                  
                  {quote.projectTotals.constructionMonths > 0 && (
                    <>
                      <div className="breakdown-item">
                        <span className="label">Active Construction Duration</span>
                        <span className="value">{quote.projectTotals.constructionMonths} months</span>
                      </div>
                      <div className="breakdown-item">
                        <span className="label">Inspection Frequency</span>
                        <span className="value">{quote.projectTotals.inspectionsPerMonth}x per month ({formData.weeklyInspections ? 'Weekly' : 'Bi-weekly'})</span>
                      </div>
                      <div className="breakdown-item">
                        <span className="label">Total Routine Inspections</span>
                        <span className="value">{quote.projectTotals.totalRoutineInspections} @ ${quote.calculated.total} each</span>
                      </div>
                      <div className="breakdown-item" style={{borderBottom: 'none', paddingBottom: '12px'}}>
                        <span className="label">Routine Inspections Subtotal</span>
                        <span className="value" style={{fontSize: '18px', fontWeight: '700', color: 'white'}}>${quote.projectTotals.routineInspectionsTotal.toLocaleString()}</span>
                      </div>
                      
                      <div className="breakdown-item" style={{borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '16px', marginTop: '12px'}}>
                        <span className="label">Post-Storm Event Inspections</span>
                        <span className="value">{quote.projectTotals.totalPostStormInspections} @ ${quote.calculated.total} each</span>
                      </div>
                      <div className="breakdown-item" style={{borderBottom: 'none', paddingBottom: '12px', fontSize: '13px', color: 'rgba(255,255,255,0.6)'}}>
                        <span className="label">(0.6 events/month × {quote.projectTotals.constructionMonths} months, rounded up)</span>
                        <span className="value" style={{fontSize: '18px', fontWeight: '700', color: 'white'}}>${quote.projectTotals.postStormInspectionsTotal.toLocaleString()}</span>
                      </div>
                    </>
                  )}
                  
                  {quote.projectTotals.postConstructionMonths > 0 && (
                    <>
                      <div className="breakdown-item" style={{borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '16px', marginTop: '12px'}}>
                        <span className="label">Post-Construction Duration</span>
                        <span className="value">{quote.projectTotals.postConstructionMonths} months</span>
                      </div>
                      <div className="breakdown-item">
                        <span className="label">Inspection Frequency</span>
                        <span className="value">1x per month (every 28 days)</span>
                      </div>
                      <div className="breakdown-item">
                        <span className="label">Total Post-Construction Inspections</span>
                        <span className="value">{quote.projectTotals.totalPostConstructionInspections} @ ${quote.calculated.postConstruction} each</span>
                      </div>
                      <div className="breakdown-item" style={{borderBottom: 'none', paddingBottom: '12px'}}>
                        <span className="label">Post-Construction Subtotal</span>
                        <span className="value" style={{fontSize: '18px', fontWeight: '700', color: 'white'}}>${quote.projectTotals.postConstructionInspectionsTotal.toLocaleString()}</span>
                      </div>
                    </>
                  )}
                  
                  <div className="breakdown-item" style={{
                    borderTop: '2px solid rgba(0, 212, 255, 0.5)',
                    paddingTop: '20px',
                    marginTop: '16px',
                    fontSize: '20px',
                    fontWeight: '700'
                  }}>
                    <span className="label">INSPECTIONS SUBTOTAL</span>
                    <span className="value">${quote.projectTotals.inspectionsSubtotal.toLocaleString()}</span>
                  </div>
                  
                  {quote.projectTotals.permittingTotal > 0 && (
                    <div style={{
                      background: 'rgba(255, 193, 7, 0.1)',
                      border: '1px solid rgba(255, 193, 7, 0.3)',
                      borderRadius: '12px',
                      padding: '16px',
                      marginTop: '20px'
                    }}>
                      <div className="breakdown-item" style={{padding: '0', borderBottom: 'none'}}>
                        <span className="label">Stormwater Permitting Assistance</span>
                        <span className="value">1 project @ $300</span>
                      </div>
                      <div className="breakdown-item" style={{padding: '8px 0 0 0', borderBottom: 'none', fontSize: '18px', fontWeight: '700'}}>
                        <span className="label">Permitting Subtotal</span>
                        <span className="value">${quote.projectTotals.permittingTotal.toLocaleString()}</span>
                      </div>
                    </div>
                  )}
                  
                  <div className="breakdown-item" style={{
                    background: 'linear-gradient(135deg, rgba(123, 47, 247, 0.2) 0%, rgba(0, 212, 255, 0.2) 100%)',
                    border: '2px solid rgba(0, 212, 255, 0.5)',
                    borderRadius: '12px',
                    padding: '20px',
                    marginTop: '20px',
                    fontSize: '24px',
                    fontWeight: '700'
                  }}>
                    <span className="label">TOTAL PROJECT PRICE</span>
                    <span className="value">${quote.projectTotals.projectTotal.toLocaleString()}</span>
                  </div>
                </div>
              </div>
            )}
            
            {quote && (
              <div className="card">
                <h2 style={{marginBottom: '24px'}}>📄 Next Steps</h2>
                <div style={{display: 'flex', gap: '16px', flexWrap: 'wrap'}}>
                  <button 
                    className="button" 
                    onClick={duplicateForNewGC}
                    style={{flex: '1', minWidth: '250px'}}
                  >
                    📄
                    Duplicate for Another GC
                  </button>
                  <button 
                    className="button" 
                    onClick={() => {
                      // Prepare quote data for proposal generation
                      const quoteData = {
                        clientName: formData.clientName,
                        projectName: formData.projectName,
                        projectAddress: formData.projectAddress,
                        projectCity: formData.projectCity,
                        projectCounty: formData.projectCounty,
                        projectType: formData.projectType,
                        disturbedAcres: formData.disturbedAcres,
                        siteContactName: formData.siteContactName,
                        siteContactEmail: formData.siteContactEmail,
                        siteContactPhone: formData.siteContactPhone,
                        summitContact: formData.summitContact,
                        summitEmail: formData.summitEmail,
                        summitPhone: formData.summitPhone,
                        constructionMonths: formData.constructionMonths,
                        weeklyInspections: formData.weeklyInspections,
                        flatRateBiWeeklyMultiplier: parseFloat(formData.flatRateBiWeeklyMultiplier) || 2.5,
                        flatRateWeeklyMultiplier: parseFloat(formData.flatRateWeeklyMultiplier) || 5.0,
                        closestInspector: quote.inspector?.name || 'Unknown',
                        services: {
                          include1A: formData.include1A,
                          price1A: formData.price1A,
                          description1A: formData.description1A,
                          include1B: formData.include1B,
                          price1B: formData.price1B,
                          description1B: formData.description1B,
                          includePermitting: formData.includePermitting,
                          permittingPrice: formData.permittingPrice,
                          permittingDescription: formData.permittingDescription,
                          include5: formData.include5,
                          price5: formData.price5,
                          tableDescription5: formData.tableDescription5,
                          scopeDescription5: formData.scopeDescription5,
                          include6: formData.include6,
                          price6: formData.price6,
                          tableDescription6: formData.tableDescription6,
                          scopeDescription6: formData.scopeDescription6,
                          routine: {
                            qty: quote.projectTotals.totalRoutineInspections,
                            rate: quote.calculated.finalRoutineRate || quote.calculated.total,
                            total: quote.projectTotals.routineInspectionsTotal
                          },
                          postStorm: {
                            qty: quote.projectTotals.totalPostStormInspections,
                            rate: quote.calculated.finalRoutineRate || quote.calculated.total,
                            total: quote.projectTotals.postStormInspectionsTotal
                          },
                          postConstruction: {
                            qty: quote.projectTotals.totalPostConstructionInspections,
                            rate: quote.calculated.finalPostConstructionRate || quote.calculated.postConstruction,
                            total: quote.projectTotals.postConstructionInspectionsTotal
                          }
                        },
                        projectTotal: quote.projectTotals.projectTotal
                      };
                      
                      // Create downloadable file with inspector name in filename
                      const jsonString = JSON.stringify(quoteData, null, 2);
                      const blob = new Blob([jsonString], { type: 'application/json' });
                      const url = URL.createObjectURL(blob);
                      const link = document.createElement('a');
                      link.href = url;
                      const inspectorName = quote.inspector?.name || 'Inspector';
                      const inspectorLastName = inspectorName.split(' ').pop();
                      const sanitize = (str) => str.replace(/[^a-zA-Z0-9]/g, '_');
                      link.download = `${sanitize(formData.clientName)}_${sanitize(formData.projectName)}_${sanitize(inspectorLastName)}_Quote.json`;
                      document.body.appendChild(link);
                      link.click();
                      document.body.removeChild(link);
                      URL.revokeObjectURL(url);
                    }}
                    style={{
                      flex: '1',
                      minWidth: '250px',
                      background: 'linear-gradient(135deg, #10b981 0%, #059669 100%)',
                      boxShadow: '0 8px 24px rgba(16, 185, 129, 0.3)'
                    }}
                  >
                    📄
                    Download Quote Data
                    →
                  </button>
                </div>
                <div style={{
                  marginTop: '16px',
                  padding: '12px 16px',
                  background: 'rgba(255, 193, 7, 0.1)',
                  border: '1px solid rgba(255, 193, 7, 0.3)',
                  borderRadius: '12px',
                  fontSize: '13px',
                  color: 'rgba(255,255,255,0.7)'
                }}>
                  <strong style={{color: '#ffc107'}}>Workflow:</strong> "Duplicate for Another GC" creates more quotes. "Download Quote Data" saves a .json file to send for Word proposal generation.
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<StormwaterQuoteGenerator />);
    
    </script>
</body>
</html>
